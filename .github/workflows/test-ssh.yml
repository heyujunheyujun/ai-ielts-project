name: Test SSH Connection

on:
  workflow_dispatch:  # 手动触发

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root  # 或你的用户名
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "✅ SSH 连接成功！"
            echo "当前用户: $(whoami)"
            echo "当前目录: $(pwd)"
            echo "服务器时间: $(date)"
            ls -la