name: Build & Deploy

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x  # 开启调试模式，显示执行的命令
      
            echo "=== Step 1: Docker Login ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            echo "=== Step 2: Pull Image ==="
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "=== Step 3: Stop Old Container ==="
            docker stop ielts-app 2>/dev/null || echo "No container to stop"
            docker rm ielts-app 2>/dev/null || echo "No container to remove"
            
            echo "=== Step 4: Run New Container ==="
            docker run -d \
              --name ielts-app \
              --restart unless-stopped \
              -p 5000:5000 \
              -e DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "=== Step 5: Verify Deployment ==="
            sleep 3
            docker ps --filter "name=ielts-app"
            echo "✅ Deployment completed!"
